name: ginkgo-ram-bringup
on:
  workflow_dispatch:
  push:
    branches: [codex/ginkgo-ram-bringup]
    paths:
      - .github/workflows/ram-bringup.yml
      - tools/ginkgo-ram-adt.py
      - tools/test-ram-boot.py
permissions:
  contents: read
  actions: read
env:
  KERNEL_REPOSITORY: welderporto/ios-sweet
  KERNEL_RUN: '41936932602'
  KERNEL_SOURCE_COMMIT: 59b9b4e464f61217572b6601401eff667f2e1c35
concurrency:
  group: ginkgo-ram-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ram-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc clang qemu-system-arm cpio gzip gawk tesseract-ocr tesseract-ocr-eng
          mkdir -p /tmp/mkbootimg
          curl --connect-timeout 15 --max-time 90 --retry 1 -fLsS https://android.googlesource.com/platform/system/tools/mkbootimg/+archive/refs/heads/main.tar.gz | tar xz -C /tmp/mkbootimg
          sudo ln -s /tmp/mkbootimg/mkbootimg.py /usr/local/bin/mkbootimg
      - name: Wait for and verify instrumented ginkgo kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/kernel
          gh run watch "$KERNEL_RUN" -R "$KERNEL_REPOSITORY" --interval 30 --exit-status
          test "$(gh api repos/$KERNEL_REPOSITORY/actions/runs/$KERNEL_RUN --jq .head_sha)" = "$KERNEL_SOURCE_COMMIT"
          gh run download "$KERNEL_RUN" -R "$KERNEL_REPOSITORY" -n xnu-kernel-ginkgo-slim -D artifacts/kernel
          digest=$(awk '$2=="kernel.development.sweet"{print $1}' artifacts/kernel/SHA256SUMS)
          test "${#digest}" = 64
          python3 tools/verify-ginkgo-isa.py artifacts/kernel/kernel.development.sweet "$digest"
          python3 tools/check-isa.py artifacts/kernel/kernel.development.sweet | tee artifacts/kernel-isa.txt
          printf '{"repository":"%s","kernelRun":"%s","kernelCommit":"%s","kernelSha256":"%s"}\n' "$KERNEL_REPOSITORY" "$KERNEL_RUN" "$KERNEL_SOURCE_COMMIT" "$digest" > artifacts/source.json
      - name: Build shims and open source init
        run: |
          mkdir -p artifacts
          qemu-system-aarch64 -M virt,dumpdtb=/tmp/packaging-only.dtb -cpu cortex-a53 -smp 8 -m 3G -nographic
          # This FDT is only for build.sh packaging. Its boot.img is discarded.
          # The phone boot.img must be packaged locally with its own stock DTB.
          BOARD=ginkgo DTB=/tmp/packaging-only.dtb bash shim/build.sh
          cp shim/out/Image artifacts/ginkgo-Image
          cp shim/out/shim.elf artifacts/ginkgo-shim.elf
          BOARD=qemu DTB=/tmp/packaging-only.dtb bash shim/build.sh
          cp shim/out/Image artifacts/qemu-Image
          python3 tools/qemu-shim.py artifacts/qemu-Image artifacts/diagnostic --cpu cortex-a53 --smp 17 --mem 3G --test-payload
          clang -target arm64-apple-ios16.0 -c tools/sweet-init.S -o artifacts/init.o
          python3 tools/mkinit.py artifacts/init.o artifacts/init.macho
          python3 tools/check-isa.py artifacts/init.macho | tee artifacts/init-isa.txt
      - name: Build payloads and prove PID 1
        run: |
          for target in phone qemu; do
            extra=()
            if [ "$target" = qemu ]; then extra=(--qemu); fi
            python3 tools/ginkgo-ram-adt.py artifacts/$target.adt "${extra[@]}"
            python3 tools/mkpayload.py artifacts/kernel/kernel.development.sweet artifacts/$target.adt artifacts/$target-payload.bin --ramdisk artifacts/init.macho --cmdline 'debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam -noprogress rd=md0 sweetusb=0 sweetkeys=0 sweettouch=0 wdt=-1 ginkgo_irq_probe=1 startup_debug=1'
          done
          python3 tools/test-ram-boot.py artifacts/qemu-Image artifacts/qemu-payload.bin artifacts/ram-test | tee artifacts/ram-test-result.txt
          find artifacts -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ginkgo-irq-probe
          path: |
            artifacts/ginkgo-Image
            artifacts/phone-payload.bin
            artifacts/phone.adt
            artifacts/kernel/kernel.development.sweet
            artifacts/kernel/SHA256SUMS
            artifacts/kernel-isa.txt
            artifacts/init-isa.txt
            artifacts/init.macho
            artifacts/ram-test-result.txt
            artifacts/ram-test/fb.png
            artifacts/ram-test/kernel.txt
            artifacts/ram-test/screen.txt
            artifacts/source.json
            artifacts/SHA256SUMS
          retention-days: 30
